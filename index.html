<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cut">
<meta name="theme-color" content="#0f1222">
<title>Ma Sói</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0f1222;color:#e8e9f3;font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
#app{max-width:520px;margin:0 auto;padding:14px 14px 40px}
h1{font-size:22px;margin:6px 0 2px}h2{font-size:15px;margin:18px 0 8px;color:#a9acc9;font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.muted{color:#8a8db0;font-size:13px}.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
a{color:#9fb3ff;text-decoration:none}
.card{background:#1a1e36;border:1px solid #262b4a;border-radius:14px;padding:14px;margin:10px 0}
input,select{width:100%;padding:12px;border-radius:10px;border:1px solid #333a62;background:#11152b;color:#fff;font-size:16px}
button{font:inherit;border:0;border-radius:10px;padding:12px 14px;background:#2b3160;color:#fff;font-weight:600;cursor:pointer}
button:disabled{opacity:.4}
.pri{background:#5b5bf0}.red{background:#b3324a}.ghost{background:transparent;border:1px solid #333a62;color:#c9cbe6}
.full{width:100%;margin-top:8px}.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.row>.fx{flex:0 0 auto}
.code{font-size:44px;font-weight:800;letter-spacing:.18em;text-align:center;margin:4px 0}
.list>div{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #262b4a}.list>div:last-child{border:0}
.list .nm{flex:1;min-width:0}.dead .nm{opacity:.45;text-decoration:line-through}
.tag{font-size:11px;padding:2px 7px;border-radius:20px;background:#262b4a;color:#a9acc9;white-space:nowrap}
.tag.soi{background:#4a1d2a;color:#ff9db0}.tag.dan{background:#1d3a2f;color:#8fe0b8}
.step{display:flex;align-items:center;gap:8px}.step b{width:26px;text-align:center;font-size:17px}
.step button{width:38px;height:38px;padding:0;font-size:20px}
.total{font-weight:700;padding:10px;border-radius:10px;text-align:center;margin-top:8px}
.ok{background:#1d3a2f;color:#8fe0b8}.bad{background:#4a1d2a;color:#ff9db0}
.bigcard{min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:20px;padding:24px;cursor:pointer;user-select:none;background:linear-gradient(160deg,#272d5c,#151935);border:1px solid #3a4180}
.bigcard .ic{font-size:84px;line-height:1.1}.bigcard .rn{font-size:28px;font-weight:800;margin:8px 0}
.bigcard.back .ic{font-size:64px;opacity:.8}
.banner{background:#4a1d2a;color:#ffc2cf;padding:10px;border-radius:10px;text-align:center;font-weight:700;margin:10px 0}
.hint{background:#3b3315;color:#ffe08a;padding:8px 10px;border-radius:10px;font-size:13px;margin-top:8px}
.order{display:flex;flex-wrap:wrap;gap:6px}.order span{background:#262b4a;padding:5px 9px;border-radius:20px;font-size:13px}
.log>div{padding:7px 0;border-bottom:1px dashed #262b4a;font-size:14px;display:flex;gap:8px}.log .ph{color:#8a8db0;white-space:nowrap;font-size:12px;padding-top:2px}
.modal{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:9}
.modal>div{background:#1a1e36;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.msg{background:#3b3315;color:#ffe08a;padding:10px;border-radius:10px;margin:8px 0}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#3ccf8e}.dot.off{background:#e0566f}
</style>
</head>
<body>
<div id="app"><p class="muted">Đang tải… (module Ma sói cần có mạng)</p></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, update, onValue, push, runTransaction, remove } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const db = getDatabase(initializeApp({
  apiKey: "AIzaSyDBxo9B1U8lkEGROBcdxExHA7Sx_wF-kHM",
  authDomain: "ma-soi-c04ba.firebaseapp.com",
  databaseURL: "https://ma-soi-c04ba-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "ma-soi-c04ba",
  storageBucket: "ma-soi-c04ba.firebasestorage.app",
  messagingSenderId: "616752597822",
  appId: "1:616752597822:web:8ca58d219f103b4d213a6f"
}));

const ROLES = {
  soi:     {name:'Sói', icon:'🐺', team:'soi', order:3, desc:'Mỗi đêm cùng bầy Sói chọn 1 người để cắn. Thắng khi số Sói ≥ số người còn lại.'},
  dan:     {name:'Dân làng', icon:'🧑‍🌾', team:'dan', desc:'Không có chức năng đêm. Ban ngày thảo luận, bỏ phiếu treo cổ Sói.'},
  tientri: {name:'Tiên tri', icon:'🔮', team:'dan', order:4, desc:'Mỗi đêm soi 1 người, quản trò cho biết người đó có phải Sói không.'},
  baove:   {name:'Bảo vệ', icon:'🛡️', team:'dan', order:2, desc:'Mỗi đêm bảo vệ 1 người khỏi bị Sói cắn. Không bảo vệ 1 người 2 đêm liên tiếp.'},
  phuthuy: {name:'Phù thủy', icon:'🧪', team:'dan', order:5, desc:'Có 1 bình cứu và 1 bình độc, mỗi bình chỉ dùng 1 lần trong cả ván.'},
  thosan:  {name:'Thợ săn', icon:'🏹', team:'dan', desc:'Khi chết được bắn kéo theo 1 người.'},
  cupid:   {name:'Cupid', icon:'💘', team:'dan', order:1, firstNight:true, desc:'Đêm đầu tiên ghép đôi 2 người. Một người chết thì người kia chết theo.'}
};
const CAUSES = ['Sói cắn','Bị treo cổ','Bình độc','Thợ săn bắn','Chết theo cặp đôi','Khác'];

const LS = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v) }catch(e){} }
};
let pid = LS.get('ms_pid');
if(!pid){ pid = Math.random().toString(36).slice(2,10) + Date.now().toString(36); LS.set('ms_pid', pid); }

const S = { name: LS.get('ms_name')||'', code:'', room:null, busy:false, msg:'', reveal:false, modal:null, online:true };
let unsub = null;
const appEl = document.getElementById('app');
const rref = (p='') => ref(db, 'rooms/' + S.code + (p ? '/' + p : ''));
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val = id => (document.getElementById(id)?.value || '').trim();
const roles = r => ({...ROLES, ...(r?.custom || {})});
const phaseLabel = p => p ? (p.t === 'dem' ? '🌙 Đêm ' : '☀️ Ngày ') + p.n : '';
const shuffle = a => { for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

/* ---------- Kết nối phòng ---------- */
function subscribe(code){
  if(unsub) unsub();
  S.code = code; LS.set('ms_code', code); S.room = undefined; render();
  unsub = onValue(ref(db, 'rooms/' + code), snap => {
    const r = snap.val();
    if(!r) return leaveLocal('Phòng đã đóng.');
    if(r.host !== pid && !(r.players && r.players[pid])) return leaveLocal('Bạn không còn trong phòng.');
    S.room = r; render();
  }, err => { S.msg = 'Lỗi kết nối: ' + err.message; render(); });
}
function leaveLocal(msg){
  if(unsub){ unsub(); unsub = null; }
  S.code = ''; S.room = null; S.reveal = false; S.modal = null; S.msg = msg || '';
  LS.set('ms_code', null); render();
}
async function run(fn){
  if(S.busy) return;
  S.busy = true; S.msg = ''; render();
  try{ await fn(); }catch(e){ S.msg = 'Lỗi: ' + e.message; }
  S.busy = false; render();
}

/* ---------- Hành động ---------- */
const A = {
  create: () => run(async () => {
    const name = val('in-name'); S.name = name; LS.set('ms_name', name);
    let config = {soi:2, dan:2, tientri:1, baove:1}, custom = null;
    try{ config = JSON.parse(LS.get('ms_config')) || config; custom = JSON.parse(LS.get('ms_custom')); }catch(e){}
    for(let i=0;i<15;i++){
      const code = String(Math.floor(1000 + Math.random()*9000));
      const s = await get(ref(db, 'rooms/' + code));
      if(!s.exists() || Date.now() - (s.val().created || 0) > 864e5){
        await set(ref(db, 'rooms/' + code), {host:pid, hostName:name || 'Quản trò', status:'lobby', created:Date.now(), config, custom});
        return subscribe(code);
      }
    }
    throw new Error('Không tạo được mã phòng, thử lại.');
  }),
  join: () => run(async () => {
    const name = val('in-name'), code = val('in-code');
    if(!name) throw new Error('Nhập tên của bạn.');
    if(!/^\d{4}$/.test(code)) throw new Error('Mã phòng gồm 4 số.');
    S.name = name; LS.set('ms_name', name);
    const s = await get(ref(db, 'rooms/' + code));
    if(!s.exists()) throw new Error('Không tìm thấy phòng ' + code + '.');
    const r = s.val();
    if(r.host === pid) return subscribe(code);
    const pl = r.players || {};
    if(pl[pid]){ await update(ref(db, `rooms/${code}/players/${pid}`), {name}); return subscribe(code); }
    if(r.status !== 'lobby') throw new Error('Ván đã bắt đầu, chờ ván sau nhé.');
    if(Object.values(pl).some(p => p.name.toLowerCase() === name.toLowerCase())) throw new Error('Tên này đã có trong phòng, đổi tên khác.');
    await set(ref(db, `rooms/${code}/players/${pid}`), {name, t:Date.now()});
    subscribe(code);
  }),
  inc: d => update(rref('config'), {[d.k]: Math.max(0, (S.room.config?.[d.k] || 0) + Number(d.v))}),
  addRole: () => run(async () => {
    const name = val('in-role'); if(!name) throw new Error('Nhập tên lá bài.');
    const team = val('in-team') || 'dan', k = 'c' + Date.now().toString(36);
    document.getElementById('in-role').value = '';
    await update(rref(), {['custom/' + k]: {name, team, icon: team === 'soi' ? '🐺' : '🃏', desc:'Lá bài tự thêm.'}, ['config/' + k]: 1});
  }),
  delRole: d => update(rref(), {['custom/' + d.k]: null, ['config/' + d.k]: null}),
  kick: d => remove(rref('players/' + d.p)),
  start: () => run(async () => {
    const r = S.room, pl = Object.keys(r.players || {}), deck = [];
    for(const [k, n] of Object.entries(r.config || {})) for(let i=0;i<n;i++) deck.push(k);
    if(deck.length !== pl.length || pl.length < 3) throw new Error('Số lá bài phải bằng số người chơi (tối thiểu 3).');
    const alive = {}; pl.forEach(p => alive[p] = true);
    await update(rref(), {status:'playing', deal:{remaining: shuffle(deck)}, alive, phase:{n:1, t:'dem'}, log:null});
    LS.set('ms_config', JSON.stringify(r.config)); LS.set('ms_custom', JSON.stringify(r.custom || null));
  }),
  draw: () => run(async () => {
    await runTransaction(rref('deal'), d => {
      if(d === null) return d;
      const taken = d.taken || {};
      if(taken[pid]) return;
      const rem = Object.values(d.remaining || {});
      if(!rem.length) return;
      const [c] = rem.splice(Math.floor(Math.random() * rem.length), 1);
      return {remaining: rem, taken: {...taken, [pid]: c}};
    });
    S.reveal = true;
  }),
  flip: () => { S.reveal = !S.reveal; render(); },
  next: () => { const p = S.room.phase; update(rref(), {phase: p.t === 'dem' ? {n:p.n, t:'ngay'} : {n:p.n + 1, t:'dem'}}); },
  openKill: d => { S.modal = d.p; render(); },
  close: () => { S.modal = null; render(); },
  kill: d => run(async () => {
    const p = S.modal; S.modal = null;
    await update(rref(), {['alive/' + p]: false});
    await push(rref('log'), {ph: phaseLabel(S.room.phase), text: `☠️ ${S.room.players[p].name} chết — ${d.c}`, t: Date.now()});
  }),
  revive: d => run(async () => {
    await update(rref(), {['alive/' + d.p]: true});
    await push(rref('log'), {ph: phaseLabel(S.room.phase), text: `↺ ${S.room.players[d.p].name} được hồi lại`, t: Date.now()});
  }),
  note: () => run(async () => {
    const t = val('in-note'); if(!t) return;
    document.getElementById('in-note').value = '';
    await push(rref('log'), {ph: phaseLabel(S.room.phase), text: t, t: Date.now()});
  }),
  delLog: d => remove(rref('log/' + d.k)),
  end: () => { if(confirm('Kết thúc ván và lật bài cho mọi người xem?')) update(rref(), {status:'ended'}); },
  newGame: () => update(rref(), {status:'lobby', deal:null, alive:null, phase:null, log:null}),
  closeRoom: () => { if(confirm('Đóng phòng? Mọi người sẽ bị thoát ra.')) run(async () => { await remove(rref()); leaveLocal(); }); },
  leave: () => run(async () => { await remove(rref('players/' + pid)); leaveLocal(); })
};
appEl.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if(el && !el.disabled) A[el.dataset.a](el.dataset);
});
appEl.addEventListener('keydown', e => {
  if(e.key !== 'Enter') return;
  if(e.target.id === 'in-note') A.note();
  if(e.target.id === 'in-code') A.join();
});

/* ---------- Giao diện ---------- */
const teamTag = t => t === 'soi' ? '<span class="tag soi">Phe Sói</span>' : '<span class="tag dan">Phe Dân</span>';
const btn = (a, label, cls='', data={}) => `<button class="${cls}" data-a="${a}" ${Object.entries(data).map(([k,v]) => `data-${k}="${esc(v)}"`).join(' ')} ${S.busy ? 'disabled' : ''}>${label}</button>`;
const msg = () => S.msg ? `<div class="msg">${esc(S.msg)}</div>` : '';
const header = (r, right='') => `<div class="top"><div><h1>🐺 Phòng ${S.code}</h1><div class="muted"><span class="dot ${S.online ? '' : 'off'}"></span> ${S.online ? 'Đang kết nối' : 'Mất mạng'} · ${r.host === pid ? 'Bạn là Quản trò' : esc(r.players[pid].name)}</div></div>${right}</div>`;

function vHome(){
  return `<div class="top"><h1>🐺 Ma Sói</h1><span class="muted"><span class="dot ${S.online ? '' : 'off'}"></span></span></div><div class="muted">1 người làm Quản trò tạo phòng, mọi người vào bằng mã 4 số.</div>${msg()}
  <div class="card"><label class="muted">Tên của bạn</label><input id="in-name" value="${esc(S.name)}" placeholder="VD: Nam" maxlength="20"></div>
  <div class="card"><h2 style="margin-top:0">Người chơi</h2>
    <div class="row"><input id="in-code" inputmode="numeric" maxlength="4" placeholder="Mã phòng">${btn('join','Vào phòng','pri fx')}</div></div>
  <div class="card"><h2 style="margin-top:0">Quản trò</h2>${btn('create','Tạo phòng mới','full ghost')}</div>`;
}

function vHostLobby(r){
  const pl = Object.entries(r.players || {}).sort((a,b) => a[1].t - b[1].t), R = roles(r), cfg = r.config || {};
  const total = Object.values(cfg).reduce((s,n) => s + n, 0), n = pl.length, okk = total === n && n >= 3;
  return `${header(r)}${msg()}
  <div class="card" style="text-align:center"><div class="muted">Mã phòng — mọi người mở Ma sói và nhập mã này</div><div class="code">${S.code}</div></div>
  <h2>Người chơi (${n})</h2><div class="card list">${pl.length ? pl.map(([p,v]) => `<div><span class="nm">${esc(v.name)}</span>${btn('kick','✕','sm ghost',{p})}</div>`).join('') : '<div class="muted">Chưa có ai vào…</div>'}</div>
  <h2>Lá bài trong ván</h2><div class="card list">
    ${Object.entries(R).map(([k,v]) => `<div><span style="font-size:22px">${v.icon}</span><span class="nm">${esc(v.name)} ${teamTag(v.team)}${r.custom?.[k] ? ' ' + btn('delRole','xóa','sm ghost',{k}) : ''}</span>
      <span class="step">${btn('inc','−','',{k,v:-1})}<b>${cfg[k] || 0}</b>${btn('inc','+','',{k,v:1})}</span></div>`).join('')}
    <div class="row"><input id="in-role" placeholder="Thêm lá bài khác…" maxlength="20"><select id="in-team" class="fx" style="width:96px"><option value="dan">Dân</option><option value="soi">Sói</option></select>${btn('addRole','+','fx')}</div>
  </div>
  <div class="total ${okk ? 'ok' : 'bad'}">${total} lá bài / ${n} người chơi${!okk ? (n < 3 ? ' — cần ít nhất 3 người' : total > n ? ` — bớt ${total - n} lá` : ` — thêm ${n - total} lá`) : ' ✓'}</div>
  <button class="pri full" data-a="start" ${okk && !S.busy ? '' : 'disabled'}>▶ Bắt đầu</button>
  ${btn('closeRoom','Đóng phòng','ghost full')}`;
}

function vPlayerLobby(r){
  const pl = Object.values(r.players || {}).sort((a,b) => a.t - b.t);
  return `${header(r)}${msg()}<div class="card" style="text-align:center"><div style="font-size:48px">⏳</div><b>Đang chờ Quản trò chọn bài và bắt đầu…</b></div>
  <h2>Trong phòng (${pl.length})</h2><div class="card list">${pl.map(v => `<div><span class="nm">${esc(v.name)}</span></div>`).join('')}</div>
  ${btn('leave','Rời phòng','ghost full')}`;
}

function aliveStats(r){
  const R = roles(r), taken = r.deal?.taken || {}, al = r.alive || {};
  let soi = 0, dan = 0;
  for(const [p, k] of Object.entries(taken)) if(al[p]) (R[k]?.team === 'soi' ? soi++ : dan++);
  return {soi, dan};
}

function vHostPlay(r){
  const R = roles(r), taken = r.deal?.taken || {}, al = r.alive || {}, ph = r.phase;
  const pl = Object.entries(r.players || {}).sort((a,b) => a[1].t - b[1].t);
  const drawn = Object.keys(taken).length, all = drawn === pl.length;
  const {soi, dan} = aliveStats(r);
  const win = all ? (soi === 0 ? 'Hết Sói — Phe Dân có thể đã thắng.' : soi >= dan ? 'Số Sói ≥ phe Dân — Phe Sói có thể đã thắng.' : '') : '';
  const order = Object.entries(R).filter(([k,v]) => v.order && (r.config?.[k] || 0) > 0 && (!v.firstNight || ph.n === 1)).sort((a,b) => a[1].order - b[1].order);
  const log = Object.entries(r.log || {}).sort((a,b) => b[1].t - a[1].t);
  const nextLbl = ph.t === 'dem' ? `→ ☀️ Ngày ${ph.n}` : `→ 🌙 Đêm ${ph.n + 1}`;
  return `${header(r)}${msg()}
  <div class="card"><div class="top"><b style="font-size:20px">${phaseLabel(ph)}</b>${btn('next', nextLbl, 'pri fx')}</div>
    <div class="muted" style="margin-top:6px">Còn sống: 🐺 Sói ${soi} · 🧑‍🌾 Phe Dân ${dan}${all ? '' : ` · Đã bốc bài ${drawn}/${pl.length}`}</div>
    ${win ? `<div class="hint">${win}</div>` : ''}
    ${ph.t === 'dem' && order.length ? `<div class="muted" style="margin:10px 0 6px">Thứ tự gọi đêm nay</div><div class="order">${order.map(([k,v],i) => `<span>${i+1}. ${v.icon} ${esc(v.name)}</span>`).join('')}</div>` : ''}
  </div>
  <h2>Người chơi</h2><div class="card list">${pl.map(([p,v]) => { const k = taken[p], ro = R[k];
    return `<div class="${al[p] ? '' : 'dead'}"><span style="font-size:22px">${ro ? ro.icon : '❔'}</span>
      <span class="nm"><b>${esc(v.name)}</b><br><span class="muted">${ro ? esc(ro.name) : 'chưa bốc bài'}</span></span>
      ${al[p] ? btn('openKill','☠️ Chết','sm red',{p}) : btn('revive','↺','sm ghost',{p})}</div>`; }).join('')}</div>
  <h2>Ghi chú diễn biến</h2><div class="card">
    <div class="row"><input id="in-note" placeholder="VD: Sói cắn An, Bảo vệ cứu An" maxlength="120">${btn('note','Ghi','fx')}</div>
    <div class="log" style="margin-top:8px">${log.length ? log.map(([k,v]) => `<div><span class="ph">${esc(v.ph)}</span><span style="flex:1">${esc(v.text)}</span>${btn('delLog','✕','sm ghost',{k})}</div>`).join('') : '<div class="muted">Chưa có ghi chú.</div>'}</div>
  </div>
  ${btn('end','Kết thúc ván & lật bài','ghost full')}${btn('newGame','Ván mới (giữ người chơi)','ghost full')}${btn('closeRoom','Đóng phòng','ghost full')}
  ${S.modal ? `<div class="modal"><div><b>${esc(r.players[S.modal]?.name)} chết vì…</b>
    ${CAUSES.map(c => btn('kill', c, 'full', {c})).join('')}${btn('close','Hủy','ghost full')}</div></div>` : ''}`;
}

function vPlayerPlay(r){
  const R = roles(r), k = r.deal?.taken?.[pid], ro = R[k], al = r.alive || {};
  const pl = Object.entries(r.players || {}).sort((a,b) => a[1].t - b[1].t);
  let card;
  if(!k) card = `<div class="card" style="text-align:center"><div style="font-size:48px">🎴</div><b>Quản trò đã sẵn sàng!</b><div class="muted">Bấm để nhận lá bài của bạn</div>${btn('draw','Chọn bài','pri full')}</div>`;
  else if(S.reveal) card = `<div class="bigcard" data-a="flip"><div class="ic">${ro?.icon || '🃏'}</div><div class="rn">${esc(ro?.name || k)}</div>${teamTag(ro?.team)}<p class="muted">${esc(ro?.desc || '')}</p><div class="muted">Chạm để úp bài</div></div>`;
  else card = `<div class="bigcard back" data-a="flip"><div class="ic">🂠</div><div class="rn">Lá bài của bạn</div><div class="muted">Chạm để xem — nhớ che màn hình</div></div>`;
  return `${header(r)}${msg()}<div class="muted" style="margin:8px 0">${phaseLabel(r.phase)}</div>
  ${k && al[pid] === false ? '<div class="banner">☠️ Bạn đã chết — giữ im lặng nhé</div>' : ''}${card}
  <h2>Người chơi</h2><div class="card list">${pl.map(([p,v]) => `<div class="${al[p] === false ? 'dead' : ''}"><span class="nm">${esc(v.name)}${p === pid ? ' (bạn)' : ''}</span>${al[p] === false ? '<span class="tag">đã chết</span>' : ''}</div>`).join('')}</div>`;
}

function vEnded(r){
  const R = roles(r), taken = r.deal?.taken || {}, al = r.alive || {}, isHost = r.host === pid;
  const pl = Object.entries(r.players || {}).sort((a,b) => a[1].t - b[1].t);
  const log = Object.values(r.log || {}).sort((a,b) => a.t - b.t);
  return `${header(r)}${msg()}<div class="card" style="text-align:center"><b style="font-size:20px">🏁 Ván đã kết thúc</b><div class="muted">Lật bài toàn bộ người chơi</div></div>
  <div class="card list">${pl.map(([p,v]) => { const ro = R[taken[p]];
    return `<div class="${al[p] === false ? 'dead' : ''}"><span style="font-size:22px">${ro?.icon || '❔'}</span><span class="nm"><b>${esc(v.name)}</b><br><span class="muted">${esc(ro?.name || 'chưa bốc')}</span></span>${ro ? teamTag(ro.team) : ''}</div>`; }).join('')}</div>
  ${log.length ? `<h2>Diễn biến</h2><div class="card log">${log.map(v => `<div><span class="ph">${esc(v.ph)}</span><span>${esc(v.text)}</span></div>`).join('')}</div>` : ''}
  ${isHost ? btn('newGame','Ván mới (giữ người chơi)','pri full') + btn('closeRoom','Đóng phòng','ghost full') : '<div class="muted" style="text-align:center">Chờ Quản trò mở ván mới…</div>'}`;
}

function view(){
  if(!S.code) return vHome();
  const r = S.room;
  if(!r) return '<p class="muted">Đang vào phòng…</p>';
  const host = r.host === pid;
  if(r.status === 'lobby') return host ? vHostLobby(r) : vPlayerLobby(r);
  if(r.status === 'playing') return host ? vHostPlay(r) : vPlayerPlay(r);
  return vEnded(r);
}

function render(){
  const keep = {};
  appEl.querySelectorAll('input,select').forEach(e => { if(e.id) keep[e.id] = e.value; });
  const ae = document.activeElement, aid = ae && appEl.contains(ae) ? ae.id : null;
  let sel = null; try{ sel = [ae.selectionStart, ae.selectionEnd]; }catch(e){}
  appEl.innerHTML = view();
  for(const [id, v] of Object.entries(keep)){ const e = document.getElementById(id); if(e) e.value = v; }
  if(aid){ const e = document.getElementById(aid); if(e){ e.focus(); try{ if(sel && sel[0] != null) e.setSelectionRange(sel[0], sel[1]); }catch(x){} } }
}

onValue(ref(db, '.info/connected'), s => { S.online = !!s.val(); render(); });
const saved = LS.get('ms_code');
if(saved) subscribe(saved); else render();
</script>
</body>
</html>
